[build-system]
requires = ["setuptools >= 40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cactus-client-envoy"
dynamic = ["version", "readme"]
requires-python = ">= 3.12"
description = "Envoy admin plugin for cactus-client — handles admin instructions against a local Envoy server"
dependencies = [
    "cactus_client @ git+https://github.com/bsgip/cactus-client.git@931250c",
    "envoy @ git+https://github.com/bsgip/envoy.git@6ddc383",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "apluggy>=1.1.2,<2",
    "python-dotenv>=1.0,<2",
]

[project.entry-points."cactus_client.admin"]
envoy = "cactus_client_envoy.plugin:EnvoyAdminPlugin"

[project.optional-dependencies]
dev = [
    "coverage",
    "bandit",
    "ty",
    "ruff",
]
test = ["assertical", "pytest", "pytest-asyncio", "pytest-cov", "pytest-postgresql", "psycopg[binary]"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cactus_client_envoy" = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "cactus_client_envoy.__version__" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "C90", "B", "UP", "ANN", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "N"]

[tool.pytest.ini_options]
pythonpath = ["src/"]
testpaths = "tests"

[tool.ty.src]
exclude = ["tests"]
